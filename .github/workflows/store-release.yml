# Store release for life-mathematics: signed AAB -> Google Play, signed IPA -> TestFlight / App Store Connect.
# Replaces azure-pipelines.yml (template flutter-deploy.yml@apps-ops). NEX-1138.
#
# Triggers
#   - workflow_dispatch: pick the track and which platforms to build.
#   - push of a tag v*: builds both platforms and uploads to Play internal + TestFlight.
#     (A tag pushed with the default GITHUB_TOKEN does not start workflows. release-please only
#     triggers this when the repo secret RELEASE_TOKEN is a PAT; otherwise use workflow_dispatch.)
#
# Public repo: no self-hosted runners and no private reusable workflows. iOS builds on macos-latest.
# Every store job is skipped (the run stays green) when its secrets are missing; the preflight job
# prints the names of the missing secrets in the run summary.
#
# Needed GitHub secrets (names only, see README "Release"):
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON
#   iOS:     ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD,
#            IOS_PROVISIONING_PROFILE_BASE64
#   Optional repo variable: ANDROID_KEY_ALIAS (default lifemathematics)
name: store-release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "internal = Play internal + TestFlight; beta = Play open testing + TestFlight; production = Play production + App Store Connect upload (no review submission)"
        type: choice
        options: [internal, beta, production]
        default: internal
      platforms:
        description: "Which stores to upload to"
        type: choice
        options: [both, android, ios]
        default: both
  push:
    tags: ["v*"]

concurrency:
  group: store-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRACK: ${{ inputs.track || 'internal' }}
  PLATFORMS: ${{ inputs.platforms || 'both' }}

jobs:
  preflight:
    name: preflight (secrets present?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - name: Check secrets
        id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing_android=""
          for n in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!n}" ] || missing_android="$missing_android $n"
          done
          missing_ios=""
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            [ -n "${!n}" ] || missing_ios="$missing_ios $n"
          done
          want_android=false; want_ios=false
          if [ "$PLATFORMS" = both ] || [ "$PLATFORMS" = android ]; then want_android=true; fi
          if [ "$PLATFORMS" = both ] || [ "$PLATFORMS" = ios ]; then want_ios=true; fi
          {
            echo "### Store release preflight (track: $TRACK, platforms: $PLATFORMS)"
            if [ "$want_android" = true ]; then
              if [ -z "$missing_android" ]; then echo "- Android: ready"; else echo "- Android: SKIPPED, missing secrets:$missing_android"; fi
            fi
            if [ "$want_ios" = true ]; then
              if [ -z "$missing_ios" ]; then echo "- iOS: ready"; else echo "- iOS: SKIPPED, missing secrets:$missing_ios"; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          android=false; ios=false
          if [ "$want_android" = true ] && [ -z "$missing_android" ]; then android=true; fi
          if [ "$want_ios" = true ] && [ -z "$missing_ios" ]; then ios=true; fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  android:
    name: android release
    needs: preflight
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'lifemathematics' }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          # android/app/build.gradle.kts reads android/key.properties (gitignored).
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "GOOGLE_PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"

      - name: Build AAB and upload to Play
        working-directory: android
        run: bundle exec fastlane android "$TRACK"
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing files
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/play-service-account.json" android/key.properties

  ios:
    name: ios release
    needs: preflight
    if: needs.preflight.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install signing certificate, provisioning profile and ASC key
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_PROV_PROFILE_UUID=$UUID"
            echo "KEYCHAIN_PATH=$KEYCHAIN"
          } >> "$GITHUB_ENV"

      - name: Build IPA and upload (beta lane = TestFlight, release lane = App Store Connect)
        working-directory: ios
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          if [ "$TRACK" = production ]; then LANE=release; else LANE=beta; fi
          bundle exec fastlane ios "$LANE"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
