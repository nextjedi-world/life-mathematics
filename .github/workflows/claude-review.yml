# Claude reviews PRs. Skipped until the repo variable CLAUDE_REVIEW_ENABLED is 'true' and the
# CLAUDE_CODE_OAUTH_TOKEN secret is set (runbook: nextjedi/platform docs/runbooks/claude-github-app.md).
# Inlined from nextjedi/platform/.github/workflows/claude-review.yml because this repo is public.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: claude-review
    if: vars.CLAUDE_REVIEW_ENABLED == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read it with `gh pr view` and `gh pr diff`, and read CLAUDE.md.
            If the PR body links a Linear issue (Fixes NEX-123) whose acceptance tests are quoted in the
            PR, judge each as Met / Not met / Can't tell. Then find real bugs in the changed code: code
            that will not compile, logic that is wrong, security holes, broken make targets. No style nits.
            Post each confirmed bug as an inline comment with
            mcp__github_inline_comment__create_inline_comment (confirmed: true), then one summary comment via
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file -`
            whose first lines are `<!-- nextjedi-claude-review -->` and `## Claude review: <verdict>`.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep,Task"
